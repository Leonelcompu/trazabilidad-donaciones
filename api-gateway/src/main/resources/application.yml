server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: donacion-service
          uri: ${DONACION_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/donaciones, /api/donaciones/**, /api/donantes, /api/donantes/**

        - id: inventario-service
          uri: ${INVENTARIO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventario, /api/inventario/**, /api/lotes, /api/lotes/**

        - id: distribucion-service
          uri: ${DISTRIBUCION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/distribuciones, /api/distribuciones/**

        - id: solicitud-service
          uri: ${SOLICITUD_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/solicitudes, /api/solicitudes/**

        - id: trazabilidad-service
          uri: ${TRAZABILIDAD_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/trazabilidad, /api/trazabilidad/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
